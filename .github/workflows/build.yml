name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Enforce free-tier artifact policy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if grep -En 'actions/(upload|download)-artifact' \
            .github/workflows/*.yml; then
            echo 'Actions artifact storage is forbidden; publish release assets directly.'
            exit 1
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          cache: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            file \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            patchelf

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DNIGHTLOCK_FORCE_VENDORED_SODIUM=ON
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Stage Windows package
        if: runner.os == 'Windows'
        run: cmake --install build --config Release --prefix "${{ github.workspace }}\stage"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $nightlockVersion = (Get-Content VERSION -Raw).Trim()
          ./packaging/windows/build_installer.ps1 `
            -StageDir "$PWD\stage" `
            -AppVersion $nightlockVersion

      - name: Verify Windows installer and bundled runtime
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $nightlockVersion = (Get-Content VERSION -Raw).Trim()
          $installer = Get-ChildItem `
            "packaging/windows/Output/Nightlock-$nightlockVersion-Windows-Setup.exe" |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Generated Windows installer was not found.'
          }
          ./.github/workflows/scripts/verify-windows-package.ps1 `
            -StageDir "$PWD\stage" `
            -InstallerPath $installer.FullName `
            -ExpectedVersion $nightlockVersion

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          NIGHTLOCK_PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          export NIGHTLOCK_ALLOW_SINGLE_ARCH=1
          cmake --install build --config Release --prefix "$PWD/stage"
          bash packaging/macos/make_dmg.sh \
            "$PWD/stage" \
            "Nightlock-$NIGHTLOCK_PACKAGE_VERSION-macOS.dmg"

      - name: Verify macOS disk image and bundled runtime
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 10
        run: |
          NIGHTLOCK_PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          bash .github/workflows/scripts/verify-macos-package.sh \
            "Nightlock-$NIGHTLOCK_PACKAGE_VERSION-macOS.dmg" \
            "$NIGHTLOCK_PACKAGE_VERSION" \
            "$(uname -m)"

      - name: Build Linux Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          NIGHTLOCK_PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          cmake --install build --config Release --prefix "$PWD/stage/usr"
          bash packaging/linux/make_deb.sh \
            "$PWD/stage" \
            "$QT_ROOT_DIR" \
            "$NIGHTLOCK_PACKAGE_VERSION" \
            "nightlock_${NIGHTLOCK_PACKAGE_VERSION}_amd64.deb"

      - name: Verify Linux package on clean Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 15
        run: |
          NIGHTLOCK_PACKAGE_VERSION="$(tr -d '[:space:]' < VERSION)"
          bash .github/workflows/scripts/verify-linux-package.sh \
            "nightlock_${NIGHTLOCK_PACKAGE_VERSION}_amd64.deb" \
            "$NIGHTLOCK_PACKAGE_VERSION"
