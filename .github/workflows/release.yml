name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match source version to release tag
        shell: bash
        run: |
          NIGHTLOCK_SOURCE_VERSION="$(tr -d '[:space:]' < VERSION)"
          NIGHTLOCK_TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$NIGHTLOCK_SOURCE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $NIGHTLOCK_SOURCE_VERSION"
            exit 1
          fi
          if [[ "$NIGHTLOCK_SOURCE_VERSION" != "$NIGHTLOCK_TAG_VERSION" ]]; then
            echo "Tag $NIGHTLOCK_TAG_VERSION does not match VERSION $NIGHTLOCK_SOURCE_VERSION"
            exit 1
          fi

  macos:
    needs: validate-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          cache: true
      - name: Configure (universal)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DNIGHTLOCK_FORCE_VENDORED_SODIUM=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package DMG
        run: |
          NIGHTLOCK_PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          cmake --install build --config Release --prefix "$PWD/stage"
          bash packaging/macos/make_dmg.sh \
            "$PWD/stage" \
            "Nightlock-$NIGHTLOCK_PACKAGE_VERSION-macOS.dmg"
      - name: Verify DMG and bundled runtime
        shell: bash
        timeout-minutes: 10
        run: |
          NIGHTLOCK_PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          bash .github/workflows/scripts/verify-macos-package.sh \
            "Nightlock-$NIGHTLOCK_PACKAGE_VERSION-macOS.dmg" \
            "$NIGHTLOCK_PACKAGE_VERSION" \
            "arm64 x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Nightlock-*-macOS.dmg

  windows:
    needs: validate-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          cache: true
      - name: Configure
        run: >
          cmake -B build
          -DNIGHTLOCK_FORCE_VENDORED_SODIUM=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Stage install
        run: cmake --install build --config Release --prefix "${{ github.workspace }}\stage"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $nightlockVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          ./packaging/windows/build_installer.ps1 `
            -StageDir "$PWD\stage" `
            -AppVersion $nightlockVersion
      - name: Verify installer and bundled runtime
        shell: pwsh
        timeout-minutes: 10
        run: |
          $nightlockVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $installer = Get-Item `
            "packaging/windows/Output/Nightlock-$nightlockVersion-Windows-Setup.exe"
          ./.github/workflows/scripts/verify-windows-package.ps1 `
            -StageDir "$PWD\stage" `
            -InstallerPath $installer.FullName `
            -ExpectedVersion $nightlockVersion
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: packaging/windows/Output/*.exe

  linux:
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          cache: true
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            file \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            patchelf
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DNIGHTLOCK_FORCE_VENDORED_SODIUM=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package deb
        run: |
          NIGHTLOCK_PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          cmake --install build --config Release --prefix "$PWD/stage/usr"
          bash packaging/linux/make_deb.sh \
            "$PWD/stage" \
            "$QT_ROOT_DIR" \
            "$NIGHTLOCK_PACKAGE_VERSION" \
            "nightlock_${NIGHTLOCK_PACKAGE_VERSION}_amd64.deb"
      - name: Verify deb on clean Ubuntu
        shell: bash
        timeout-minutes: 15
        run: |
          NIGHTLOCK_PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          bash .github/workflows/scripts/verify-linux-package.sh \
            "nightlock_${NIGHTLOCK_PACKAGE_VERSION}_amd64.deb" \
            "$NIGHTLOCK_PACKAGE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: nightlock_*_amd64.deb

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum Nightlock-* nightlock_* > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Nightlock-*-macOS.dmg
            Nightlock-*-Windows-Setup.exe
            nightlock_*_amd64.deb
            SHA256SUMS
